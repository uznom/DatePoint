<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="dpHeader" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <filter id="dpShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Calendar Base Card -->
  <rect x="2" y="5.5" width="28" height="23.5" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" filter="url(#dpShadow)"/>

  <!-- Top Banner / Header -->
  <path d="M2 10.5C2 7.73858 4.23858 5.5 7 5.5H25C27.7614 5.5 30 7.73858 30 10.5V12.5H2V10.5Z" fill="url(#dpHeader)"/>

  <!-- Calendar Punch Hangers / Rings -->
  <rect x="7" y="2.5" width="2.8" height="5.2" rx="1.4" fill="#0F172A"/>
  <rect x="22.2" y="2.5" width="2.8" height="5.2" rx="1.4" fill="#0F172A"/>

  <!-- Date Grid Dots (First Row) -->
  <circle cx="8" cy="17" r="1.5" fill="#94A3B8"/>
  <circle cx="16" cy="17" r="1.5" fill="#94A3B8"/>
  <circle cx="24" cy="17" r="1.5" fill="#94A3B8"/>

  <!-- Date Grid (Second Row) -->
  <circle cx="8" cy="23.5" r="1.5" fill="#94A3B8"/>
  <circle cx="24" cy="23.5" r="1.5" fill="#94A3B8"/>

  <!-- DatePoint Target Highlight Pin/Date -->
  <rect x="12.5" y="20" width="7" height="7" rx="2" fill="#E11D48"/>
  <circle cx="16" cy="23.5" r="1.5" fill="#FFFFFF"/>
</svg>
